{% extends 'include/base.html' %}
{% block title %}Login | MealBox{% endblock %}

{% block content %}

  <div class="card p-4 shadow mx-auto" style="max-width:440px;">
    <div class="text-center mb-4">
      <h3 class="fw-bold mb-1">
        <i class="fa-solid fa-utensils" style="color:var(--mb-cyan)"></i>
        Meal<span style="color:var(--mb-cyan)">Box</span>
      </h3>
      <p class="text-muted small mb-0">Welcome back</p>
    </div>

    {% if error %}
      <div class="alert alert-danger text-center">{{ error }}</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input name="username" type="text" class="form-control"
               placeholder="Enter username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input name="password" type="password" class="form-control"
               placeholder="Enter password" required>
      </div>
      <button type="submit" class="btn btn-warning w-100 my-2">
        <i class="fa-solid fa-right-to-bracket me-1"></i> Login
      </button>
    </form>

    <p class="text-center mt-3 mb-0" style="font-size:.85rem;">
      Don't have an account?
      <a href="{% url 'register' %}" class="fw-semibold">Register</a>
    </p>
  </div>

{% endblock %}
