{% extends 'include/base.html' %}
{% block title %}{{ category }} | MealBox{% endblock %}

{% block content %}

  <div class="mb-hero">
    <h2>{{ category }}</h2>
    <p>Browse dishes in this category</p>
  </div>

  <div class="row g-3">
    {% for meal in meals %}
      <div class="col-6 col-md-4 col-lg-3 d-flex align-items-stretch">
        <div class="card shadow-sm hover-lift text-center w-100">
          <span class="mb-skel ratio-4x3">
            <img src="{{ meal.strMealThumb }}" loading="lazy"
                 alt="{{ meal.strMeal }}">
          </span>
          <div class="card-body d-flex flex-column">
            <span class="badge text-bg-warning align-self-center mb-2">{{ meal.idMeal }}</span>
            <h6 class="card-title flex-grow-1">{{ meal.strMeal }}</h6>
            <a class="btn btn-outline-dark btn-sm mt-2" href="{% url 'recipe' meal.idMeal %}">
              <i class="fa-solid fa-eye me-1"></i> View
            </a>
          </div>
        </div>
      </div>
    {% empty %}
      <div class="mb-empty">
        <i class="fa-solid fa-utensils"></i>
        <p>No meals in this category.</p>
      </div>
    {% endfor %}
  </div>

{% endblock %}
